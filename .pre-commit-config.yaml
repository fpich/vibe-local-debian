---
# client-e2e is a standalone harness; generated golden artifacts are not linted.
exclude: ^(vibe/)?client-e2e/(?!.*\.py$)
repos:
  - repo: https://github.com/mpalmer/action-validator
    rev: 7fa61514fb806fc9afd664b909e83584aca84f78 # v0.7.0
    hooks:
      - id: action-validator

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            tests/snapshots/.*\.svg$|
            client-e2e/goldens/.*\.svg$
          )
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            tests/snapshots/.*\.svg$|
            client-e2e/goldens/.*\.svg$
          )

  - repo: https://github.com/fsouza/mirrors-pyright
    rev: 35d1c990dba50abf6fabe1becfa0c289042b2073 # v1.1.407
    hooks:
      - id: pyright
        exclude: ^(vibe/)?client-e2e/.*\.py$|tests/(agent_loop|app_server|banner|cli|snapshots|setup|onboarding)/.*$|tests/core/(compaction|config)/.*$|tests/core/llm/test_backend_error\.py$|tests/core/test_identity\.py$|tests/stubs/fake_(account_gateway|client|identity_gateway)\.py$|tests/stubs/app_config\.py$|tests/test_tracing\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 5e2fb545eba1ea9dc051f6f962d52fe8f76a9794 # v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
        exclude: ^tests/(agent_loop|app_server|banner|cli|snapshots|setup|onboarding)/.*$|tests/core/(compaction|config)/.*$|tests/core/llm/test_backend_error\.py$|tests/core/test_identity\.py$|tests/stubs/fake_(account_gateway|client|identity_gateway)\.py$|tests/stubs/app_config\.py$|tests/test_tracing\.py$
      - id: ruff-format
        args: [--check]
        exclude: ^tests/(agent_loop|app_server|banner|cli|snapshots|setup|onboarding)/.*$|tests/core/(compaction|config)/.*$|tests/core/llm/test_backend_error\.py$|tests/core/test_identity\.py$|tests/stubs/fake_(account_gateway|client|identity_gateway)\.py$|tests/stubs/app_config\.py$|tests/test_tracing\.py$

  - repo: https://github.com/crate-ci/typos
    rev: 392b78fe18a52790c53f42456e46124f77346842 # v1.34.0
    hooks:
      - id: typos
        args: [--write-changes]
        exclude: |
          (?x)^(
            __snapshots__/.*\.svg$|
            client-e2e/goldens/.*\.svg$|
            README\.md$|
            install\.sh$
          )

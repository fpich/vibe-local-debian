# vibe — configuration locale : 2 workers llama.cpp + 6 modèles API Albert (enseignant)
# Fichier de projet : modèle copié vers ~/.vibe/config.toml lors de la première
# installation. Clé Albert dans l'environnement (~/.bashrc), jamais ici :
#   export ALBERT_API_KEY="votre_jeton"
# Modèles via active_model ou /model : worker1, worker2 (llama.cpp local) ;
#   albert-coder, albert-small, albert-large, albert-deepseek, albert-gemma,
#   albert-ministral (API Albert, OpenAI-compatible).
# Deux serveurs llama.cpp locaux ou LAN (alias serveur « worker » sure chaque port).
# Côté client, chaque modèle a son alias distinct : basculer = changer
# uniquement active_model.
# ── Modèle actif : "worker1" ou "worker2" ─────────────────────────────────
active_model = "worker1"
# Seuls les modèles llama.cpp locaux sont sélectionnables (exclut les
# modèles cloud par défaut mistral/devstral du sélecteur /config).
allowed_models = [
  "worker*",
  # API Albert : globs sur les noms réels des modèles (name_matches agit
  # sur model.name, pas sur l'alias)
  "mistral-small*",
  "ministral*",
  "gpt-oss*",
  "qwen3-coder*",
  "deepseek*",
  "gemma*",
]


# ── Outils exposés à l’agent ───────────────────────────────────────────────
# Allowlist stricte : seuls les outils nécessaires au coding agent local sont
# visible par le modèle. Les outils réseau web_fetch/web_search ont été supprimés ;
# task et skill ne sont pas exposés dans ce profil minimal.
# "mcp_rea_*" expose les outils du serveur MCP local REA (décommenter le bloc
# [[mcp_servers]] en fin de fichier pour l'activer).
enabled_tools = [
  "bash",
  "read_file",
  "write_file",
  "edit",
  "grep",
  "ask_user_question",
  "todo",
  "mcp_rea_*",
]


# ── Serveur 1 : 127.0.0.1:8080 (KAT) ───────────────────────────────────
[[providers]]
name = "llamacpp-worker1"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
# llama-server determine correctement les streams avec un finish_reason
emits_finish_reason = true

# ── Serveur 2 : 127.0.0.1:8081 (Qwen3.5) ──────────────────────────────
[[providers]]
name = "llamacpp-worker2"
api_base = "http://127.0.0.1:8081/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
emits_finish_reason = true

# ── API Albert (enseignant) : modèles hébergés par l'État français, OpenAI-compatible ──
# Clé dans l'environnement, jamais dans ce fichier :
#   export ALBERT_API_KEY="votre_jeton"   (~/.bashrc)
# Catalogue : https://guides.ia.numerique.gouv.fr/albert-api/modeles/available-models
[[providers]]
name = "albert"
api_base = "https://albert.api.etalab.gouv.fr/v1"
api_key_env_var = "ALBERT_API_KEY"
api_style = "openai"
backend = "generic"
emits_finish_reason = true

# ── Worker 1 : KAT (127.0.0.1:8080) ────────────────────────────────────
# Paramètres serveur llama.cpp : top_p 0.95, top_k 20, min_p 0,
# presence_penalty 1.5, repetition_penalty 1.0.
# thinking ON, preserve_thinking ON (agent / multi-turn).
[[models]]
name = "worker1"
provider = "llamacpp-worker1"
alias = "worker1"
display_name = "worker1 (KAT, local)"
temperature = 1.0
thinking = "high"
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 80000

# ── Worker 2 : Qwen3.5 (127.0.0.1:8081) ────────────────────────────────
# Paramètres serveur llama.cpp : top_p 0.8, top_k 20, min_p 0,
# presence_penalty 1.5, repetition_penalty 1.0. thinking OFF.
[[models]]
name = "worker2"
provider = "llamacpp-worker2"
alias = "worker2"
display_name = "worker2 (Qwen3.5, local)"
temperature = 0.7
thinking = "off"
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 80000


# ── Modèles API Albert (basculer via active_model ou /model) ───────────────────────
# Les contexts distants (131k-262k) acceptent le sous-ensemble d'outils REA
# et de longues conversations. Les modèles OCR (lightonocr-2-1b) ne sont pas
# des modèles de chat et ne sont pas déclarés ici.


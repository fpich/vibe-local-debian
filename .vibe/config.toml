# vibe — configuration locale, backend llama.cpp uniquement
# Fichier de projet : chargé en priorité sur ~/.vibe/config.toml
#
# Deux modèles disponibles sur le même serveur, exposés sous l'alias unique
# « worker ». Basculer l'un/l'autre = changer uniquement active_model.

# ── Modèle actif : "worker-ornith" ou "worker-kat" ───────────────────────────
active_model = "worker-kat"

# ── Cloud désactivé ─────────────────────────────────────────────────────────
enable_telemetry = false
enable_otel = false
otel_endpoint = ""
enable_update_checks = false
enable_auto_update = false

[[providers]]
name = "llamacpp"
api_base = "http://192.168.1.116:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
# llama-server termine correctement les streams avec un finish_reason
emits_finish_reason = true

# ── Ornith 1.5 35B (DeepReinforce) — raisonnement long, chasse aux bugs ──────
# Optimaux (model card officielle) : temp 0.6, top_p 0.95, top_k 20.
#   top_p/top_k côté serveur (llama.cpp) ; alternative benchs : temp 1.0.
#   Modèle de raisonnement : thinking natif, le serveur renvoie reasoning_content.
[[models]]
name = "worker-ornith"
provider = "llamacpp"
alias = "worker"
display_name = "Ornith 1.5 35B (local)"
temperature = 0.6
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 200000

# ── KAT-Coder V2.5 Dev (Kwaipilot) — tool-calls réguliers, économe en tokens ─
# Paramètres appliqués : temp 0.6, top_p 0.95, top_k 20 (unifiés avec Ornith).
#   top_p/top_k côté serveur (--top-p 0.95 --top-k 20 dans l'unit systemd).
#   Thinking plus court qu'Ornith → tours plus rapides, compaction plus tardive.
#   Alternative si trop créatif : temp 0.3 (APEX-I-Quality) ; min_p 0.05 possible serveur.
[[models]]
name = "worker-kat"
provider = "llamacpp"
alias = "worker"
display_name = "KAT-Coder V2.5 Dev (local)"
temperature = 0.6
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 200000

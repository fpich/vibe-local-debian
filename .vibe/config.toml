# vibe — configuration locale : 2 workers llama.cpp + 6 modèles API Albert (enseignant)
# Fichier de projet : modèle copié vers ~/.vibe/config.toml lors de la première
# installation. Clé Albert dans ~/.vibe/.env (chargé automatiquement), jamais ici :
#   install -m 600 /dev/null ~/.vibe/.env
#   echo 'ALBERT_API_KEY="votre_jeton"' > ~/.vibe/.env
# Modèles via active_model ou /model : worker1, worker2 (llama.cpp local) ;
#   albert-coder, albert-small, albert-large, albert-deepseek, albert-gemma,
#   albert-ministral (API Albert, OpenAI-compatible).
# Deux serveurs llama.cpp locaux ou LAN (alias serveur « worker » sure chaque port).
# Côté client, chaque modèle a son alias distinct : basculer = changer
# uniquement active_model.
# ── Modèle actif : "worker1" ou "worker2" ─────────────────────────────────
active_model = "worker1"
# Seuls les modèles llama.cpp locaux sont sélectionnables (exclut les
# modèles cloud par défaut mistral/devstral du sélecteur /config).
allowed_models = [
  "worker*",
  # API Albert : globs sur les noms réels des modèles (name_matches agit
  # sur model.name, pas sur l'alias)
  "mistral-small*",
  "ministral*",
  "gpt-oss*",
  "qwen3-coder*",
  "deepseek*",
  "gemma*",
]


# ── Outils exposés à l’agent ───────────────────────────────────────────────
# Allowlist stricte : seuls les outils nécessaires au coding agent local sont
# visible par le modèle. Les outils réseau web_fetch/web_search ont été supprimés ;
# task et skill ne sont pas exposés dans ce profil minimal.
# "mcp_rea_*" expose les outils du serveur MCP local REA (décommenter le bloc
# [[mcp_servers]] en fin de fichier pour l'activer).
enabled_tools = [
  "bash",
  "read_file",
  "write_file",
  "edit",
  "grep",
  "ask_user_question",
  "todo",
  # REA : sous-ensemble reverse-engineering (22 outils ≈ 42k tokens de
  # définitions). Le catalogue complet (170 outils) en fait ~529k et dépasse
  # même un contexte 262k ; la liste explicite protège le prompt.
  "mcp_rea_open_binary",
  "mcp_rea_binary_overview",
  "mcp_rea_binary_session",
  "mcp_rea_close_binary",
  "mcp_rea_search_procedures",
  "mcp_rea_search_strings",
  "mcp_rea_procedure_info",
  "mcp_rea_procedure_pseudo_code",
  "mcp_rea_procedure_assembly",
  "mcp_rea_procedure_callers",
  "mcp_rea_procedure_callees",
  "mcp_rea_procedure_references",
  "mcp_rea_xrefs",
  "mcp_rea_address_name",
  "mcp_rea_set_address_name",
  "mcp_rea_set_comment",
  "mcp_rea_read_bytes",
  "mcp_rea_read_function_instructions",
  "mcp_rea_resolve_containing_procedure",
  "mcp_rea_list_unknowns",
  "mcp_rea_record_unknown",
  "mcp_rea_trace_feature",
]


# ── Serveur 1 : 127.0.0.1:8080 (KAT) ───────────────────────────────────
[[providers]]
name = "llamacpp-worker1"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
# llama-server determine correctement les streams avec un finish_reason
emits_finish_reason = true

# ── Serveur 2 : 127.0.0.1:8081 (Ministral-3-3B-Instruct-2512, Q6_K_L, 262144)
[[providers]]
name = "llamacpp-worker2"
api_base = "http://127.0.0.1:8081/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
emits_finish_reason = true

# ── API Albert (enseignant) : modèles hébergés par l'État français, OpenAI-compatible ──
# Clé dans ~/.vibe/.env (chargé automatiquement), jamais dans ce fichier :
#   echo 'ALBERT_API_KEY="votre_jeton"' > ~/.vibe/.env
# Catalogue : https://guides.ia.numerique.gouv.fr/albert-api/modeles/available-models
[[providers]]
name = "albert"
api_base = "https://albert.api.etalab.gouv.fr/v1"
api_key_env_var = "ALBERT_API_KEY"
api_style = "openai"
backend = "generic"
emits_finish_reason = true

# ── Worker 1 : KAT (127.0.0.1:8080) ────────────────────────────────────
# Serveur : llama-server -c 262144 --temp 0.6 --top-p 0.95 --top-k 20
#   -fa on -ctk q8_0 -ctv q8_0 -b 8192 -ub 2048 -t 8 -tb 8 --jinja
# ── Worker 1 : KAT-Coder-V2.5-Dev-APEX (127.0.0.1:8080) ──────────────────────────
# Serveur : llama-server -m KAT-Coder-V2.5-Dev-APEX-i-quality-v2.gguf
#   --port 8080 -c 262144 --temp 0.6 --top-p 0.95 --top-k 20 -fa on
#   -ctk q8_0 -ctv q8_0 -b 8192 -ub 2048 -t 8 -tb 8 --jinja
# thinking ON, preserve_thinking ON (agent / multi-turn).
[[models]]
name = "worker1"
provider = "llamacpp-worker1"
alias = "worker1"
display_name = "worker1 (KAT Coder V2.5 APEX, local 262k)"
temperature = 0.6
thinking = "high"
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 200000


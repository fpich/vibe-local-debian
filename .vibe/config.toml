# ── Serveur MCP local REA (analyse de binaires via Ghidra) ──────────────────────
#
# Transport stdio uniquement (ADR 0002) ; l'installation se fait avec
# scripts/install_ghidra_rea.sh. Décommenter après installation.

#[[mcp_servers]]
#name = "rea"
#transport = "stdio"
#command = "npx"
#args = ["-y", "rea-agents@6.4.0", "mcp"]
#env = { GHIDRA_INSTALL_DIR = "/opt/ghidra_12.1.4_PUBLIC", JAVA_HOME = "/usr/lib/jvm/java-21-openjdk-amd64" }

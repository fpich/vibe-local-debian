# ── Titres de session ─────────────────────────────────────────────────────
# "first_message" : titre dérivé du premier message utilisateur, zéro appel LLM
# (défaut local). "llm" : génération en arrière-plan. "off" : aperçu.
[session_logging]
auto_title = "first_message"

[default]
# "mis-aligned LINKEDIT string pool" is a verbatim macOS dyld error message
# quoted in CHANGELOG.md, not a misspelling of "miss".
extend-ignore-re = ["(?m)^.*(#|//)\\s*typos:disable-line$", "datas", "mis-aligned LINKEDIT string pool"]

[default.extend-words]
# French words in README.md / install.sh (this fork is documented in French).
amont = "amont"
installe = "installe"
Installe = "Installe"
copie = "copie"
presse = "presse"
supporte = "supporte"
Maintenir = "Maintenir"
classe = "classe"
constitue = "constitue"
"Commandes" = "Commandes"
"Composants" = "Composants"
"Exemples" = "Exemples"
"Recommandations" = "Recommandations"
"authentification" = "authentification"
"branche" = "branche"
"certificats" = "certificats"
"collecte" = "collecte"
"commandes" = "commandes"
"composants" = "composants"
"construit" = "construit"
"contient" = "contient"
"contraintes" = "contraintes"
"demandes" = "demandes"
"exemple" = "exemple"
"explicite" = "explicite"
"inexistant" = "inexistant"
"complet" = "complet"
"environnement" = "environnement"
"Environnement" = "Environnement"
"limite" = "limite"

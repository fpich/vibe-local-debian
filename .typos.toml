# Rust TUI crate (vibe/cli-rust/); not the dish "ratatouille".
ratatui = "ratatui"
iterm = "iterm"
ITERM = "ITERM"
asend = "asend"
certifi = "certifi"
# Additive Increase / Multiplicative Decrease — congestion-control acronym,
# not the word "aimed".
AIMD = "AIMD"
# E2E fixture string: "abcd" with 'c' deleted, not the word "and".
abd = "abd"

[default.extend-identifiers]
# macOS pasteboard four-char-code for the PNG flavor — required verbatim
# by AppleScript syntax (`the clipboard as «class PNGf»`).
PNGf = "PNGf"

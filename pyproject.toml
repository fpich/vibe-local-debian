[project]
name = "mistral-vibe"
version = "1.2.1"
description = "Local-first CLI coding agent for self-hosted llama.cpp"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "vibe-local-debian contributors" }]
keywords = [
    "ai",
    "cli",
    "coding-assistant",
    "llm",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.7",
    "gitpython==3.1.62",
    "giturlparse==0.15.0",
    "httpx==0.28.1",
    "humanize==4.16.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "packaging==26.2",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pyperclip==1.11.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "setproctitle==1.3.7",
    "textual==8.2.8",
    "textual-speedups==0.2.1",
    "tomli-w==1.2.0",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "truststore==0.10.4",
    "watchfiles==1.2.0",
    "zstandard==0.25.0",
]

[project.urls]
Homepage = "https://github.com/fpich/vibe-local-debian"
Repository = "https://github.com/fpich/vibe-local-debian"
Issues = "https://github.com/fpich/vibe-local-debian/issues"
Documentation = "https://github.com/fpich/vibe-local-debian#readme"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vibe*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.tcss", "plugin.json", "skills/*/SKILL.md"]

[[tool.uv.index]]
default = true
name = "pypi"
url = "https://pypi.org/simple"

[project.scripts]
vibe = "vibe.cli.launcher:main"
vibe-app-server = "vibe.app_server.stdio:main"

[tool.uv]
exclude-newer = "2 days"
cache-keys = [
    { file = "pyproject.toml" },
]
index-strategy = "first-index"
package = true
required-version = ">=0.8.0"
override-dependencies = [
    # pytest-textual-snapshot exact-pins syrupy==4.8.0, which caps pytest<9.
    # syrupy 4.8.0 runs fine on pytest 9 (generation, comparison and diffs all
    # verified); the cap is conservative, so override it to clear GHSA-6w46-j5rx-g56g.
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "cryptography>=48.0.0",
    "pre-commit-uv>=4.3.0",
    "pre-commit>=4.2.0",
    "pyinstrument>=5.1.2",
    "pyright>=1.1.403",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.2.0",
    "pytest-textual-snapshot>=1.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyte>=0.8.2",
    "respx>=0.22.0",
    "ruff>=0.15.18",
    "tomlkit>=0.13.0",
    "twine>=5.0.0",
    "typos>=1.34.0",
    "vulture>=2.14",
]

build = [
    "altgraph==0.17.5",
    "macholib==1.16.4 ; sys_platform == 'darwin'",
    "packaging==26.2",
    "pefile==2024.8.26 ; sys_platform == 'win32'",
    "pyinstaller==6.20.0",
    "pyinstaller-hooks-contrib==2026.4",
    "pywin32-ctypes==0.2.3 ; sys_platform == 'win32'",
    "setuptools==83.0.0",
]

[tool.pyright]
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

include = ["vibe/**/*.py", "tests/local/**/*.py"]
exclude = ["pyinstaller/"]
venvPath = "."
venv = ".venv"

[tool.ruff]
include = ["vibe/**/*.py", "tests/local/**/*.py"]
exclude = ["pyinstaller/"]
line-length = 88
target-version = "py312"
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F",
    "I",
    "D2",
    "UP",
    "TID",
    "ANN",
    "PLR",
    "B0",
    "B905",
    "RUF022",
    "RUF010",
    "RUF012",
    "RUF019",
    "RUF100",
    "TC004",
]
ignore = ["D203", "D205", "D213", "ANN401", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["vibe"]
known-third-party = []
force-sort-within-sections = true
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = false
order-by-type = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pylint]
max-public-methods = 26
max-positional-args = 10
max-statements = 50
max-branches = 15
max-locals = 15
max-args = 10
max-returns = 6
max-nested-blocks = 5

[tool.vulture]
ignore_decorators = ["@*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/local",
  "tests/backend",
  "tests/core/agent_loop",
  "tests/core/autocompletion",
  "tests/core/utils",
  "tests/core/vision",
]
addopts = "-q"

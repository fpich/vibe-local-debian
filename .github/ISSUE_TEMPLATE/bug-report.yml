name: Bug report
description: Signaler un défaut dans vibe-local-debian
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris le problème et le comportement attendu.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands/étapes minimales permettant de reproduire.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "vibe 1.2.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Debian 13, Python 3.13, uv 0.12.x"
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend llama.cpp
      description: Modèle, version llama.cpp, endpoint sans secret, options pertinentes.
  - type: textarea
    id: logs
    attributes:
      label: Trace / logs
      description: Masquer les secrets et données privées.
      render: shell

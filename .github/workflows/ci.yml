name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python "${{ matrix.python-version }}" --group dev

      - name: Compile sources
        run: uv run python -m compileall -q vibe

      - name: Verify CLI entry points
        run: |
          uv run vibe --version
          uv run vibe-app-server --help

      - name: Lint maintained sources and tests
        run: uv run ruff check vibe tests/local

      - name: Check formatting of maintained sources and tests
        run: uv run ruff format --check vibe tests/local

      - name: Type-check the runtime
        run: uv run pyright vibe

      - name: Test stable fork contracts and e2e suites
        run: uv run pytest

      - name: Test shell/paths/git/tools suites
        run: uv run pytest tests/tools tests/core/git tests/core/paths tests/core/tools

      - name: Build pure-Python wheel
        run: uv build --wheel

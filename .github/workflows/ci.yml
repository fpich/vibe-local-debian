name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python "${{ matrix.python-version }}" --group dev

      - name: Compile sources
        run: uv run python -m compileall -q vibe

      - name: Verify CLI entry points
        run: |
          uv run vibe --version
          uv run vibe-app-server --help

      - name: Lint maintained sources and tests
        run: uv run ruff check vibe tests/local

      - name: Test stable fork contracts
        run: uv run pytest

      - name: Build pure-Python wheel
        run: uv build --wheel
